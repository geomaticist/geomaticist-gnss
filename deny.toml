# cargo-deny policy: permissive licences only in the engine.
# Run: cargo deny --all-features check   (part of `cargo xtask ci`)

[graph]
all-features = true
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
# MPL-2.0 only unmodified (file-level copyleft). LGPL is allowed only for dynamically linked C
# libraries, which never appear in the engine. GPL / AGPL are banned (not listed).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # R1: no GDAL / PROJ / network / GUI in the engine (also enforced by `cargo xtask check-deps`).
    { name = "gdal" }, { name = "gdal-sys" }, { name = "proj" }, { name = "proj-sys" },
    { name = "reqwest" }, { name = "tokio" }, { name = "hyper" }, { name = "ureq" },
    { name = "egui" }, { name = "eframe" }, { name = "slint" }, { name = "wgpu" }, { name = "winit" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste (a compile-time proc-macro crate) is unmaintained; it reaches us through faer -> gemm, the
    # Cholesky / inverse of the engine's normal equations. No code of it runs
    # at run time. Revisit when faer / gemm move off it.
    { id = "RUSTSEC-2024-0436", reason = "paste: compile-time only, via faer -> gemm" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

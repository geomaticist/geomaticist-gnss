# Python bindings for the Geomaticist GNSS engine: one abi3 wheel per platform.
# Build: maturin build --release   (from this folder), or maturin develop --release into a virtual environment.
[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "geomaticist-gnss-py"
description = "GNSS post-processing from Python: RINEX, raw receiver decoders, static baselines, PPK with camera events, and PPP"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT OR Apache-2.0"
authors = [{ name = "Troy Hicks" }]
keywords = ["gnss", "gps", "rinex", "ppk", "ppp", "surveying", "geodesy", "drone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: GIS",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/geomaticist/geomaticist-gnss"
Documentation = "https://github.com/geomaticist/geomaticist-gnss/tree/main/examples/python"

[tool.maturin]
features = []
module-name = "geomaticist_gnss_py"
